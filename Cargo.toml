[package]
name = "quilt"
version = "1.2.5"
edition = "2024"

[lints.rust]
unused = "allow" # <- REMOVE LATER!!!

[profile.release]
panic = "abort"
strip = "debuginfo"

[dependencies]
anyhow = "1.0.93"
byteorder = "1.5.0"
eframe = { version = "0.36.0" }
egui = "0.36.0"
egui_dock = "0.21.0"
egui_extras = "0.29.0"
gctex = "0.3.12"
gfarch = "0.3.0"
hex = "0.4.3"
image = "0.25.5"
rayon = "1.11.0"
reqwest = { version = "0.12.9", features = ["blocking"] }
rfd = "0.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.133", features = ["preserve_order"] }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"

[build-dependencies]
winresource = "0.1.19"
